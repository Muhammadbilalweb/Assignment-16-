<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Layout</title>

<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial,sans-serif}

.layout{
 display:grid;
 width:100%;
 text-align:center;
 gap:3px;
 color:white;
}
.layout div{
 display:flex;
 justify-content:center;
 align-items:center;
 padding:15px;
 min-width:0;
}
.header{background:#10172c}
.menu{background:#ef354b}
.hero{background:#4d86c5}
.main{background:#24354e}
.banner{background:#ffd365;color:#333}
.extra{background:#4cbb9c;color:#123}
.image{background:#bde5e5;color:#222}

/* DESKTOP: above 800px */
.layout{
 grid-template-columns: 2fr 1fr 1fr;
 grid-template-rows:55px 310px 205px 105px;
}
.header{grid-area:1/1/2/2}
.menu{grid-area:1/2/2/4}
.hero{grid-area:2/1/3/4}
.main{grid-area:3/1/4/2}
.image{grid-area:3/3/4/4}
.extra{grid-area:3/3/4/4;align-self:end;height:50%}
.banner{grid-area:4/1/5/4}

/* TABLET: 501px to 800px */
@media(max-width:800px){
 .layout{
  grid-template-columns:1fr 1fr;
  grid-template-rows:55px 210px 105px 100px 100px;
 }
 .header{grid-area:1/1/2/3}
 .hero{grid-area:2/1/3/3}
 .menu{grid-area:3/1/6/2}
 .main{grid-area:3/2/4/3}
 .banner{grid-area:4/2/5/3}
 .extra{grid-area:5/2/6/2;height:auto}
 .image{grid-area:5/1/6/2}
}

/* MOBILE: 500px and below */
@media(max-width:500px){
 .layout{
  grid-template-columns:1fr;
  grid-template-rows:55px 55px 135px 135px 100px 100px 100px;
 }
 .header{grid-area:1/1}
 .menu{grid-area:2/1}
 .hero{grid-area:3/1}
 .main{grid-area:4/1}
 .banner{grid-area:5/1}
 .extra{grid-area:6/1;height:auto}
 .image{grid-area:7/1}
}
</style>
</head>

<body>
<div class="layout">
 <div class="header">HEADER</div>
 <div class="menu">MENU</div>
 <div class="hero">HERO</div>
 <div class="main">MAIN</div>
 <div class="banner">BANNER</div>
 <div class="extra">EXTRA</div>
 <div class="image">IMAGE</div>
</div>
</body>
</html>
